<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dokumen OHS</title>
    <meta name="description" content="Daftar dokumen unit Occupational Health and Safety (OHS)." />
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="stylesheet" href="assets/css/dokumen.css" />
    <link rel="icon" type="image/png" href="assets/img/logo-k3.png" />
</head>

<body data-page="documents">
    <!-- ============= SIDEBAR ============= -->
    <aside class="sidebar offcanvas-xl offcanvas-start" tabindex="-1" id="sidebar" aria-labelledby="sidebarTitle">
        <div class="sidebar-brand">
            <div class="brand-logo" aria-hidden="true">
                <img src="assets\img\logo-semen-tonasa.png" alt="" srcset="" />
            </div>
            <div class="brand-text">
                <div class="brand-name" id="sidebarTitle">PT. SEMEN TONASA</div>
                <div class="brand-sub">Occupational Health &amp; Safety</div>
            </div>
            <button type="button" class="btn-close btn-close-white d-xl-none ms-auto" data-bs-dismiss="offcanvas" data-bs-target="#sidebar" aria-label="Tutup menu"></button>
        </div>
        
        <nav class="sidebar-nav" aria-label="Menu utama">
            <ul class="nav-list" id="navList"></ul>
        </nav>
        <div class="sidebar-foot"> Est. 2026</div>
    </aside>

    <!-- =============== KONTEN UTAMA =============== -->
    <div class="app-main">
        <header class="app-header">
            <button type="button" class="icon-btn" id="menuToggle" aria-controls="sidebar" aria-expanded="true" aria-label="Menu navigasi">
                <i data-lucide="menu"></i>
            </button>
            <div class="header-title">
                <h1 class="page-title">Dokumen OHS</h1>
            </div>
        </header>
        
        <main id="main" class="content" tabindex="-1">
            <section aria-labelledby="docsHeading" class="section">
                <div class="section-head">
                    <h2 class="section-title" id="docsHeading">Dokumen Unit OHS</h2>
                </div>
                <p class="section-meta mb-3">Pilih dokumen untuk dibuka.</p>
                
                <div class="doc-toolbar" role="search">
                    <div class="doc-search">
                        <label for="docSearch" class="visuallyHidden">Cari dokumen</label>
                        <i data-lucide="search" aria-hidden="true"></i>
                        <input type="search" id="docSearch" class="form-control form-control-sm" placeholder="Cari dokumen..." autocomplete="off">
                    </div>

                    <div class="tool-group">
                        <label for="docGroupFilter" class="tool-label">Grup</label>
                        <select id="docGroupFilter" class="form-select form-select-sm tool-select"></select>
                    </div>
                </div>
                <p class="section-meta doc-status" id="docStatus" role="status"></p>
                
                <div id="docsGrid"></div>

                <div class="state-box" id="docsEmpty" hidden>
                    <span>Tidak ada dokumen yang cocok.</span>
                    <button type="button" class="btn btn-sm btn-outline-primary ms-auto" id="docsReset">Reset pencarian</button>
                </div>
            </section>
            
            <footer class="app-footer">
                Unit of OHS PT. Semen Tonasa
            </footer>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@1.61.0/dist/umd/lucide.min.js"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/app.js"></script>

</body>
</html>
